<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Upload Inbox | Black Tides Software</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0c10;
      --panel: #14171d;
      --panel2: #191d24;
      --text: #f5f7fa;
      --muted: #aeb7c4;
      --line: #2b313c;
      --accent: #6ba8ff;
      --danger: #ff8f8f;
      --max: 1050px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 20% 0%, rgba(107,168,255,.12), transparent 32%), var(--bg);
      color: var(--text);
    }
    .wrap { width: min(100% - 32px, var(--max)); margin: 0 auto; }
    header { padding: 28px 0 18px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -.03em; }
    .sub { color: var(--muted); margin: 8px 0 0; }
    main { padding: 28px 0 48px; }
    .toolbar { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-bottom:18px; flex-wrap:wrap; }
    .count { color: var(--muted); }
    button, .download {
      appearance:none; border:0; border-radius:11px; padding:10px 14px; font:inherit; font-weight:750;
      background:var(--accent); color:#07111f; cursor:pointer; text-decoration:none; display:inline-block;
    }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .list { display:grid; gap:14px; }
    .item { background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.025)); border:1px solid var(--line); border-radius:16px; padding:18px; }
    .top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
    .filename { font-size:1.06rem; font-weight:800; overflow-wrap:anywhere; }
    .date { color:var(--muted); font-size:.9rem; white-space:nowrap; }
    .meta { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 18px; margin-top:14px; }
    .field { min-width:0; }
    .label { color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; font-weight:750; }
    .value { margin-top:2px; overflow-wrap:anywhere; }
    .notes { margin-top:14px; padding-top:14px; border-top:1px solid var(--line); white-space:pre-wrap; }
    .actions { margin-top:16px; }
    .empty, .error { border:1px dashed var(--line); border-radius:16px; padding:30px; color:var(--muted); text-align:center; }
    .error { color:var(--danger); }
    footer { color:var(--muted); text-align:center; padding:0 0 36px; font-size:.9rem; }
    @media (max-width:650px){ .meta { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Upload Inbox</h1>
      <p class="sub">Private Black Tides Software file submissions.</p>
    </div>
  </header>
  <main>
    <div class="wrap">
      <div class="toolbar">
        <div class="count" id="count">Loading uploads…</div>
        <button id="refresh" type="button">Refresh</button>
      </div>
      <div class="list" id="list"></div>
    </div>
  </main>
  <footer><div class="wrap">Black Tides Software LLC</div></footer>

  <script>
    const listEl = document.getElementById('list');
    const countEl = document.getElementById('count');
    const refreshBtn = document.getElementById('refresh');

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function formatDate(value) {
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return value || 'Unknown';
      return d.toLocaleString();
    }

    function render(uploads) {
      countEl.textContent = `${uploads.length} upload${uploads.length === 1 ? '' : 's'}`;
      if (!uploads.length) {
        listEl.innerHTML = '<div class="empty">No uploads yet.</div>';
        return;
      }

      listEl.innerHTML = uploads.map((item) => `
        <article class="item">
          <div class="top">
            <div class="filename">${escapeHtml(item.originalFilename || 'Uploaded file')}</div>
            <div class="date">${escapeHtml(formatDate(item.uploadedAt))}</div>
          </div>
          <div class="meta">
            <div class="field"><div class="label">Sender</div><div class="value">${escapeHtml(item.name || 'Not provided')}</div></div>
            <div class="field"><div class="label">Email</div><div class="value">${escapeHtml(item.email || 'Not provided')}</div></div>
            <div class="field"><div class="label">Type</div><div class="value">${escapeHtml(item.contentType || 'Unknown')}</div></div>
            <div class="field"><div class="label">Upload ID</div><div class="value">${escapeHtml(item.uploadId || '')}</div></div>
          </div>
          ${item.notes ? `<div class="notes"><div class="label">Notes</div><div class="value">${escapeHtml(item.notes)}</div></div>` : ''}
          <div class="actions"><a class="download" href="${escapeHtml(item.downloadPath)}">Download</a></div>
        </article>
      `).join('');
    }

    async function load() {
      refreshBtn.disabled = true;
      countEl.textContent = 'Loading uploads…';
      listEl.innerHTML = '';
      try {
        const response = await fetch('/api/inbox-list', { cache: 'no-store' });
        if (!response.ok) throw new Error(`Request failed (${response.status})`);
        const data = await response.json();
        render(Array.isArray(data.uploads) ? data.uploads : []);
      } catch (error) {
        countEl.textContent = 'Unable to load uploads';
        listEl.innerHTML = `<div class="error">${escapeHtml(error.message || 'Unable to load uploads.')}</div>`;
      } finally {
        refreshBtn.disabled = false;
      }
    }

    refreshBtn.addEventListener('click', load);
    load();
  </script>
</body>
</html>
